name: c349f-book
# C349F forward paper log: the C348F book plus the C349 stablecoin-supply stream at the C358 capped sizes (CFD and crypto-perp accounts).
# Daily 09:40 and 21:30 ET via ci/scheduler.py; Yahoo, data.binance.vision and DefiLlama public data, no orders, no account. State on state-c349f.
# Every run freezes the next days' C349 signals before those UTC days start. First logged day 2026-12-01; review 2027-12-01.
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: c349f, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {TZ: America/New_York, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: if [ -f ci/ENABLED ]; then echo "on=1" >> $GITHUB_OUTPUT; else echo "on=0" >> $GITHUB_OUTPUT; fi
      - if: steps.gate.outputs.on == '1'
        run: ci/state.sh restore c349f c349f/state
      - if: steps.gate.outputs.on == '1'
        run: python3 c349f/book_logger.py c349f/state
      - if: steps.gate.outputs.on == '1' && always()
        run: ci/state.sh save c349f c349f/state
