name: c391f-book
# C391F rolling-cohort forward paper log: the C391 short-horizon prop book (MyFundedPerps Elite $10K, MFFU Pro 50K, Velotrade 5K, CFT 5K), one-attempt cohorts started daily
# Daily 09:40 and 21:30 ET via ci/scheduler.py; Yahoo and data.binance.vision public data, no orders, no account.
# State on state-c391f. First logged day 2026-12-01; review 2027-12-01.
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: c391f, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {TZ: America/New_York, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: if [ -f ci/ENABLED ]; then echo "on=1" >> $GITHUB_OUTPUT; else echo "on=0" >> $GITHUB_OUTPUT; fi
      - if: steps.gate.outputs.on == '1'
        run: ci/state.sh restore c391f c391f/state
      - if: steps.gate.outputs.on == '1'
        run: python3 c391f/book_logger.py c391f/state
      - if: steps.gate.outputs.on == '1' && always()
        run: ci/state.sh save c391f c391f/state
