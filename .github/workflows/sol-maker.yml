name: sol-maker
# C226: paper market-maker replay on Kalshi hourly SOL (gated) / BTC / ETH ladders (public data only, no orders, no keys)
on:
  schedule:
    - cron: "6 */6 * * *"
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: solmaker, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {TZ: America/New_York, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: if [ -f ci/ENABLED ]; then echo "on=1" >> $GITHUB_OUTPUT; else echo "on=0" >> $GITHUB_OUTPUT; fi
      - if: steps.gate.outputs.on == '1'
        run: ci/state.sh restore solmaker solmaker/state
      - if: steps.gate.outputs.on == '1'
        run: cd solmaker && python3 sol_maker.py
      - if: steps.gate.outputs.on == '1' && always()
        run: ci/state.sh save solmaker solmaker/state
